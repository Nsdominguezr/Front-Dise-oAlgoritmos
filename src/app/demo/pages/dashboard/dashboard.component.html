<div class="dashboard-container">
    <div class="dashboard-header">
    <div class="header-content">
    <h1>Bar Don Juancho - Dashboard</h1>
      <p *ngIf="usuario">Welcome, <strong>{{ usuario.username }}</strong></p>
    </div>
    <div class="header-actions">
        <app-theme-toggle></app-theme-toggle>
        <button class="logout-button" (click)="logout()">
        <span>🚪</span> Logout
        </button>
    </div>
</div>

<div class="dashboard-content">
    <div class="welcome-section">
        <h2>Main Panel</h2>
        <p>Available actions:</p>
    </div>

    <div class="buttons-grid">
    <button class="action-button" routerLink="/productos">
        <span class="button-icon">📦</span>
        <span class="button-text">Manage Products</span>
    </button>

    <button class="action-button">
        <span class="button-icon">📋</span>
        <span class="button-text">Manage Orders</span>
    </button>

    <button class="action-button">
        <span class="button-icon">📊</span>
        <span class="button-text">Reports</span>
    </button>

    <button class="action-button" routerLink="/usuarios">
        <span class="button-icon">👥</span>
        <span class="button-text">Manage Users</span>
    </button>

    <button class="action-button" routerLink="/sedes">
        <span class="button-icon">🏪</span>
        <span class="button-text">Manage Locations</span>
    </button>

    <button class="action-button">
        <span class="button-icon">⚙️</span>
        <span class="button-text">Settings</span>
    </button>

    <button class="action-button">
        <span class="button-icon">❓</span>
        <span class="button-text">Help</span>
    </button>
    </div>
</div>
</div>
