<div class="dashboard-container">
    <div class="dashboard-header">
    <div class="header-content">
    <h1>Bar Don Juancho - Home</h1>
      <p *ngIf="usuario">Welcome, <strong>{{ usuario.username }}</strong> - <span class="rol-badge">{{ rol }}</span></p>
    </div>
    <div class="header-actions">
        <app-theme-toggle></app-theme-toggle>
        <button class="logout-button" (click)="logout()">
        <span>🚪</span> Logout
        </button>
    </div>
</div>

<div class="dashboard-content">
    <div class="welcome-section">
        <h2>Main Panel</h2>
        <p>Available actions for your role:</p>
    </div>

    <div class="buttons-grid">
    <button
        *ngFor="let item of filteredMenuItems"
        class="action-button"
        [class.disabled]="item.disabled"
        [routerLink]="item.disabled ? null : item.path">
        <span class="button-icon">{{ item.icon }}</span>
        <span class="button-text">{{ item.label }}</span>
        <span *ngIf="item.disabled" class="badge-soon">Soon</span>
    </button>
    </div>
</div>
</div>
