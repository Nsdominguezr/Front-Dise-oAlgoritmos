<div class="login-container">
    <!-- Theme toggle fuera de la tarjeta -->
    <div class="theme-toggle-wrapper">
        <app-theme-toggle></app-theme-toggle>
    </div>

    <div class="login-content">
    <!-- Header -->
    <div class="login-header">
        <h1>Bar Don Juancho</h1>
        <p>Welcome! Please login or register to continue.</p>
    </div>

    <!-- Login Solo -->
    <div class="login-only-header">
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message">
    <span class="error-icon">⚠️</span>
    <p>{{ error }}</p>
    </div>

    <!-- Login Tab -->
    <div *ngIf="activeTab === 'login'" class="form-container">
    <form (ngSubmit)="onLogin()">
        <!-- Username/Email -->
        <div class="form-group">
        <label for="login-username">Username</label>
        <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
            type="text"
            id="login-username"
            [(ngModel)]="username"
            name="username"
            placeholder="Enter your username"
            [disabled]="loading">
        </div>
        </div>

        <!-- Password -->
        <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
            [type]="showPassword ? 'text' : 'password'"
            id="login-password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            [disabled]="loading">
            <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [disabled]="loading">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
            </button>
        </div>
        </div>

        <!-- Submit Button -->
        <button
        type="submit"
        class="submit-button"
        [disabled]="loading">
        {{ loading ? 'Loading...' : 'Login' }}
        </button>
    </form>
    </div>

    <!-- Registro Tab -->
    <div *ngIf="activeTab === 'registro'" class="form-container">
    <form (ngSubmit)="onRegistro()">
        <!-- Username -->
        <div class="form-group">
        <label for="reg-username">Username</label>
        <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
            type="text"
            id="reg-username"
            [(ngModel)]="username"
            name="username"
            placeholder="Choose a unique username"
            [disabled]="loading">
        </div>
        </div>

        <!-- Password -->
        <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
            [type]="showPassword ? 'text' : 'password'"
            id="reg-password"
            [(ngModel)]="password"
            name="password"
            placeholder="Minimum 6 characters"
            [disabled]="loading">
            <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [disabled]="loading">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
            </button>
        </div>
        </div>

        <!-- Rol -->
        <div class="form-group">
        <label for="rol_id">Role</label>
        <div class="input-wrapper">
            <span class="input-icon">👨‍💼</span>
            <select
            id="rol_id"
            [(ngModel)]="rol_id"
            name="rol_id"
            [disabled]="loading">
            <option value="2">Local Admin</option>
            <option value="3">Cashier</option>
            <option value="4">Waiter</option>
            </select>
        </div>
        </div>

        <!-- Sede -->
        <div class="form-group">
        <label for="sede_id">Location</label>
        <div class="input-wrapper">
            <span class="input-icon">🏪</span>
            <select
            id="sede_id"
            [(ngModel)]="sede_id"
            name="sede_id"
            [disabled]="loading">
            <option value="1">North Location</option>
            <option value="2">Central Location</option>
            <option value="3">South Location</option>
            </select>
        </div>
        </div>

        <!-- Submit Button -->
        <button
        type="submit"
        class="submit-button"
        [disabled]="loading">
        {{ loading ? 'Loading...' : 'Register' }}
        </button>
    </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
    <p>© 2026 Bar Don Juancho. All rights reserved.</p>
    </div>
</div>

<!-- Decorative Elements -->
<div class="decorative-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
</div>
</div>
